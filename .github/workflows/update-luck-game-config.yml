name: luck-game — Oyun Ayarlarını Güncelle (Devnet)

# initialize() yalnızca bir kez çalışır. Oyun zaten kuruluyken hazine
# cüzdanını, ödülleri, oranları ya da paket tarifesini değiştirmenin tek
# yolu update_config() — bu workflow onu çağırır.
#
# DİKKAT: update_config TÜM alanları baştan yazar. Boş bırakılan girdiler
# için script, src/config.ts içindeki GAME_CONFIG ile aynı varsayılanları
# kullanır; yani sadece değiştirmek istediğiniz alanı doldurmanız yeterli.
on:
  workflow_dispatch:
    inputs:
      program_id:
        description: 'Kurulu oyunun Program ID (site config.ts / GAME_CONFIG.programId)'
        required: true
        type: string
      treasury_wallet:
        description: 'Hazine cüzdanı: paket satışlarının %20si + kazanılan ödüllerin %20si buraya gider'
        required: true
        type: string
      treasury_fee_bps:
        description: 'Ev payı (bps, 2000 = %20). Boş bırakılırsa 2000.'
        required: false
        type: string
      small_prize_sol:
        description: 'Küçük ödül (SOL). Boş bırakılırsa 0.5.'
        required: false
        type: string
      big_prize_sol:
        description: 'Büyük ödül / jackpot (SOL). Boş bırakılırsa 1.'
        required: false
        type: string
      vault_threshold_sol:
        description: 'Kolay moda geçiş eşiği (SOL). Boş bırakılırsa 2.'
        required: false
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Deploy anahtarını yaz
        run: |
          mkdir -p ~/.config/solana
          cat > ~/.config/solana/id.json <<'KEYFILE'
          ${{ secrets.LUCK_GAME_DEPLOY_KEY }}
          KEYFILE

      - name: update_config() çağır
        env:
          PROGRAM_ID: ${{ inputs.program_id }}
          TREASURY_WALLET: ${{ inputs.treasury_wallet }}
          TREASURY_FEE_BPS: ${{ inputs.treasury_fee_bps }}
          SMALL_PRIZE_SOL: ${{ inputs.small_prize_sol }}
          BIG_PRIZE_SOL: ${{ inputs.big_prize_sol }}
          VAULT_THRESHOLD_SOL: ${{ inputs.vault_threshold_sol }}
          KEYPAIR_PATH: /home/runner/.config/solana/id.json
          RPC_URL: https://api.devnet.solana.com
        run: node program/luck-game/scripts/update-config.mjs
