name: luck-game — Update the Game Settings (Devnet)

# initialize() runs only once. Once the game is set up, the only way to change
# the treasury wallet, the prizes, the odds or the package tariff is
# update_config() — and this workflow calls it.
#
# CAREFUL: update_config rewrites EVERY field from scratch. For inputs left
# empty, the script uses the same defaults as GAME_CONFIG in src/config.ts; so
# you only need to fill in the field you actually want to change.
on:
  workflow_dispatch:
    inputs:
      program_id:
        description: 'The Program ID of the installed game (site config.ts / GAME_CONFIG.programId)'
        required: true
        type: string
      treasury_wallet:
        description: 'The treasury wallet: 20% of the package sales + 20% of the prizes won go here'
        required: true
        type: string
      treasury_fee_bps:
        description: 'The house share (bps, 2000 = 20%). Defaults to 2000 when left empty.'
        required: false
        type: string
      small_prize_sol:
        description: 'The small prize (SOL). Defaults to 0.5 when left empty.'
        required: false
        type: string
      big_prize_sol:
        description: 'The big prize / jackpot (SOL). Defaults to 1 when left empty.'
        required: false
        type: string
      vault_threshold_sol:
        description: 'The threshold for switching to easy mode (SOL). Defaults to 2 when left empty.'
        required: false
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Write the deploy key
        run: |
          mkdir -p ~/.config/solana
          cat > ~/.config/solana/id.json <<'KEYFILE'
          ${{ secrets.LUCK_GAME_DEPLOY_KEY }}
          KEYFILE

      - name: Call update_config()
        env:
          PROGRAM_ID: ${{ inputs.program_id }}
          TREASURY_WALLET: ${{ inputs.treasury_wallet }}
          TREASURY_FEE_BPS: ${{ inputs.treasury_fee_bps }}
          SMALL_PRIZE_SOL: ${{ inputs.small_prize_sol }}
          BIG_PRIZE_SOL: ${{ inputs.big_prize_sol }}
          VAULT_THRESHOLD_SOL: ${{ inputs.vault_threshold_sol }}
          KEYPAIR_PATH: /home/runner/.config/solana/id.json
          RPC_URL: https://api.devnet.solana.com
        run: node program/luck-game/scripts/update-config.mjs
