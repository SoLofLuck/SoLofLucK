name: luck-game — Initialize the Game (Devnet or Mainnet)

on:
  workflow_dispatch:
    inputs:
      program_id:
        description: 'The Program ID from the deploy-luck-game workflow output'
        required: true
        type: string
      treasury_wallet:
        description: 'The treasury wallet the 20% fee share goes to (public key)'
        required: true
        type: string
      network:
        description: "The chain to run initialize() on. devnet (DEFAULT) is the test network; mainnet-beta is the live one."
        required: false
        type: choice
        default: devnet
        options: [devnet, mainnet-beta]

# If initialize() has already been called the script skips it silently, so this
# workflow can safely be triggered more than once.

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Determine the RPC endpoint
        run: |
          if [ "${{ inputs.network }}" = "mainnet-beta" ]; then
            if [ -n "${{ secrets.HELIUS_API_KEY }}" ]; then
              echo "RPC_URL=https://mainnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}" >> "$GITHUB_ENV"
            else
              echo "RPC_URL=https://api.mainnet-beta.solana.com" >> "$GITHUB_ENV"
            fi
          else
            if [ -n "${{ secrets.HELIUS_API_KEY }}" ]; then
              echo "RPC_URL=https://devnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}" >> "$GITHUB_ENV"
            else
              echo "RPC_URL=https://api.devnet.solana.com" >> "$GITHUB_ENV"
            fi
          fi

      - name: Write the deploy key
        run: |
          mkdir -p ~/.config/solana
          cat > ~/.config/solana/id.json <<'KEYFILE'
          ${{ secrets.LUCK_GAME_DEPLOY_KEY }}
          KEYFILE

      - name: Call initialize()
        env:
          PROGRAM_ID: ${{ inputs.program_id }}
          TREASURY_WALLET: ${{ inputs.treasury_wallet }}
          KEYPAIR_PATH: /home/runner/.config/solana/id.json
        run: node program/luck-game/scripts/initialize.mjs
