name: luck-distributor — Devnet End-to-End Rehearsal

# The tests run without ever connecting to a chain (16 scenarios) and cover the
# logic. But those tests are not what runs on TGE day: a real mint, a real RPC,
# real ATAs and the initialize-round.mjs script itself are. The gap between the
# two can only be closed by running on a real chain.
#
# This rehearsal opens and claims a full round with a throwaway mint and three
# fake buyers, on the real presale schedule (9% + 13 x 7%). It touches no real
# asset.

on:
  workflow_dispatch:
    inputs:
      program_id:
        description: 'luck-distributor Program ID'
        required: true
        default: 'G8hKTeAbpMCwNTn7WzKnT6PFxnVfLJuvQFg5XBTX2E8e'
        type: string
      round_id:
        description: 'Rehearsal round number (must not collide with real rounds)'
        required: false
        default: '900'
        type: string

jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Audits
        run: npm run verify

      - name: Install the Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # The public devnet RPC rate-limits hard (429s) under the airdrop +
      # multiple-transaction load a rehearsal generates — the same reason
      # src/config.ts prefers Helius for the live site. Use it here too when
      # the secret is set; the public endpoint is still the fallback so the
      # workflow keeps working for anyone who has not added the secret.
      - name: Determine the RPC endpoint
        run: |
          if [ -n "${{ secrets.HELIUS_API_KEY }}" ]; then
            echo "RPC_URL=https://devnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}" >> "$GITHUB_ENV"
          else
            echo "RPC_URL=https://api.devnet.solana.com" >> "$GITHUB_ENV"
          fi

      - name: Write the deploy key
        run: |
          mkdir -p ~/.config/solana
          cat > ~/.config/solana/id.json <<'KEYFILE'
          ${{ secrets.LUCK_GAME_DEPLOY_KEY }}
          KEYFILE
          solana config set --url "$RPC_URL" --keypair ~/.config/solana/id.json

      - name: Devnet SOL
        run: |
          for i in 1 2 3 4 5 6; do
            if solana airdrop 2; then break; fi
            echo "Airdrop attempt $i failed, retrying in 20s."
            sleep 20
          done
          solana balance

      - name: Rehearsal
        env:
          PROGRAM_ID: ${{ inputs.program_id }}
          ROUND_ID: ${{ inputs.round_id }}
          KEYPAIR_PATH: /home/runner/.config/solana/id.json
        run: node program/luck-distributor/scripts/rehearsal.mjs

  full-flow:
    # IN SEQUENCE, NOT in parallel. Both jobs use the same devnet wallet: run in
    # parallel they both ask for an airdrop and both spend, and one runs the
    # other out of money. Which it did — the full-flow rehearsal failed with
    # "insufficient lamports" while the distribution rehearsal was running at the
    # same time.
    needs: rehearse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install the Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Determine the RPC endpoint
        run: |
          if [ -n "${{ secrets.HELIUS_API_KEY }}" ]; then
            echo "RPC_URL=https://devnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}" >> "$GITHUB_ENV"
          else
            echo "RPC_URL=https://api.devnet.solana.com" >> "$GITHUB_ENV"
          fi

      - name: Write the deploy key
        run: |
          mkdir -p ~/.config/solana
          cat > ~/.config/solana/id.json <<'KEYFILE'
          ${{ secrets.LUCK_GAME_DEPLOY_KEY }}
          KEYFILE
          solana config set --url "$RPC_URL" --keypair ~/.config/solana/id.json

      - name: Devnet SOL
        run: |
          for i in 1 2 3 4 5 6; do
            if solana airdrop 2; then break; fi
            echo "Airdrop attempt $i failed, retrying in 20s."
            sleep 20
          done
          solana balance

      # THE FULL FLOW: contribution → buyer list → merkle → distributor → claim
      #
      # The rehearsal above only proves the distribution side. The two links in
      # the middle (presale-buyers.mjs reading the chain, and build-merkle.mjs
      # reading that output) had never run on a real chain — and while writing
      # this rehearsal two bugs turned up in exactly that spot: the presale path
      # did not work at all because of an argument-parsing bug, and the units
      # were off by a factor of 10^9.
      - name: Full-flow rehearsal
        env:
          PROGRAM_ID: ${{ inputs.program_id }}
          ROUND_ID: '901'
          KEYPAIR_PATH: /home/runner/.config/solana/id.json
        run: node program/luck-distributor/scripts/full-flow-rehearsal.mjs
