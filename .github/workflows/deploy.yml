name: GitHub Pages'e Dağıt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Build
        env:
          # Solana Vakfı'nın public RPC'leri hız sınırlı; varsa Helius API
          # anahtarını build'e enjekte ediyoruz (bkz. src/config.ts).
          # Repo Settings → Secrets and variables → Actions → HELIUS_API_KEY
          # secret'ı olarak eklenmeli. Yoksa build public endpoint'e düşer.
          VITE_HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: npm run build

      - name: Pages'i yapılandır
        uses: actions/configure-pages@v5

      - name: Build çıktısını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
