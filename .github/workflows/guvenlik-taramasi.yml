name: Güvenlik Taraması

# ---------------------------------------------------------------------------
# ÜCRETSİZ DENETİM KATMANI
# ---------------------------------------------------------------------------
# Ücretli bir denetimin verdiği iki şeyden biri MEKANİK bulgular: bilinen
# zafiyet kalıpları, bağımlılık açıkları, şüpheli Rust kalıpları. Bu iş akışı
# tam olarak o kısmı, ücretsiz araçlarla ve her değişiklikte koşturuyor.
#
# İnsan yargısı (— "bu tasarım kararı ekonomik olarak sömürülebilir mi") bu
# iş akışının kapsamı DIŞINDA. Buradan yeşil çıkmak "denetimden geçtik"
# demek değil; "bilinen kalıpları taradık" demek. Fark önemli ve öyle
# anlatılmalı.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Bağımlılık açıkları KODU DEĞİŞTİRMEDEN ortaya çıkıyor: dün temiz olan
    # bir paket için bugün bir güvenlik bildirimi yayınlanabilir. Bu yüzden
    # haftalık olarak da koşuyor.
    - cron: '17 6 * * 1'

jobs:
  clippy:
    name: clippy (sıkı)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        program: [luck-game, luck-distributor]
    steps:
      - uses: actions/checkout@v4
      # BİLEREK `stable`, sabit bir sürüm değil.
      #
      # Yeni bir Rust sürümü yeni lint'ler getiriyor ve bunlar bizim kodumuz
      # değişmeden PR'ı kırmızıya çevirebiliyor — nitekim ilk koşuda tam
      # olarak bu oldu: yerelde clippy 1.94 temizken CI'daki 1.98 iki şey
      # daha buldu (`unnecessary_sort_by`, `manual_div_ceil`). İkisi de
      # gerçekten iyileştirmeydi.
      #
      # Sürümü sabitlemek bu gürültüyü keserdi ama yeni lint'leri de
      # kaybederdik. Bu iş akışı deploy yolunda DEĞİL — burada kırmızı
      # olmak bir yayını engellemiyor, yalnızca "bak buna" diyor. O yüzden
      # güncel kalmayı tercih ediyoruz.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: program/${{ matrix.program }} -> target

      # -D warnings: uyarılar HATA sayılıyor, yoksa birikip görünmez oluyorlar.
      #
      # İki istisna, ikisi de bilinçli:
      #
      #   unexpected_cfgs — Anchor'ın makroları `anchor-debug`, `custom-heap`,
      #     `custom-panic`, `solana` gibi cfg'ler üretiyor; bunlar bizim
      #     kodumuz değil ve susturmanın başka yolu yok.
      #
      #   clippy::too_many_arguments — initialize() ve update_config() 12
      #     parametre alıyor çünkü OYUNUN YAPILANDIRMASI o kadar geniş.
      #     Bunları bir struct'a sarmak Anchor'ın istemci tarafındaki ABI'sini
      #     değiştirirdi ve elde edilen tek şey lint'i susturmak olurdu.
      - name: clippy
        working-directory: program/${{ matrix.program }}
        run: |
          cargo clippy --all-targets --locked -- \
            -D warnings \
            -A unexpected_cfgs \
            -A clippy::too_many_arguments

  bagimliliklar:
    name: bağımlılık açıkları
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        program: [luck-game, luck-distributor]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # cargo-audit: RustSec güvenlik bildirimleri veritabanına karşı tarar.
      #
      # Bu, varsayımsal bir risk değil: luck-distributor'ın İLK deploy'u tam
      # olarak bir bağımlılık sürprizi yüzünden düşmüştü (zeroize_derive
      # 1.5.0 edition2024 istedi). O bir uyumluluk sorunuydu, güvenlik
      # sorunu değil — ama aynı kanaldan bir GÜVENLİK açığı da gelebilir ve
      # kimse bir şey değiştirmemiş olur.
      - name: cargo-audit kurulumu
        run: cargo install cargo-audit --locked

      # cargo-audit'i ÇALIŞTIR ve JSON çıktısını sakla. Kendi çıkış kodunu
      # kullanmıyoruz: cargo-audit "unsound"/"unmaintained" uyarılarında da
      # 1 döndürüyor ve bu uyarılar yukarı akıştan geliyor, düzeltemiyoruz.
      # Kararı aşağıdaki adım veriyor.
      - name: cargo-audit — rapor üret
        working-directory: program/${{ matrix.program }}
        run: |
          cargo audit --json > audit.json || true
          if [ ! -s audit.json ]; then
            echo "::error::cargo audit hiç çıktı üretmedi — denetim koşmadı sayılır."
            exit 1
          fi
          echo "Tüm kilit dosyasında bulunanlar:"
          jq -r '"  açık: \(.vulnerabilities.count)"' audit.json
          jq -r '.warnings | to_entries[] | "  \(.key): \(.value | length)"' audit.json || true

      # NOT: sert kapı artık burada DEĞİL — aşağıdaki
      # "zincire giren paketlerde açık var mı" adımında. Sebebi:
      # cargo audit Cargo.lock'u tarıyor ve Cargo.lock testler için gelen
      # TÜM Solana validator/TLS yığınını içeriyor (h2, quinn, rustls,
      # ring, tokio, curve25519-dalek...). İlk koşuda 10 "açık" çıktı ve
      # hiçbiri zincire yüklenen programın içinde değildi. Cargo.lock'u
      # zincirdeki programmış gibi denetlemek bir kategori hatası.

      # GÖRÜNÜR AMA ENGELLEMEZ: "unsound" ve "unmaintained" uyarıları.
      #
      # İlk koşuda altı uyarı çıktı: lru, memmap2, ouroboros, rand,
      # sized-chunks, solana_rbpf. Hiçbiri açık değil ve — asıl önemlisi —
      # hiçbiri zincire yüklenen bytecode'a girmiyor:
      #
      #   * lru, memmap2, ouroboros, rand, solana_rbpf yalnızca
      #     solana-program-test üzerinden geliyor, yani [dev-dependencies].
      #   * sized-chunks, `im` üzerinden solana-frozen-abi'ye bağlı ve
      #     solana-frozen-abi'de `im` şu şekilde tanımlı:
      #       [target."cfg(not(target_os = \"solana\"))".dependencies.im]
      #     yani SBF derlemesinde hiç derlenmiyor.
      #
      # Bu yüzden `--deny warnings`i sert kapı YAPMIYORUZ — yaparsak,
      # düzeltemeyeceğimiz (yukarı akıştaki) uyarılar yüzünden her PR kırmızı
      # olur ve kısa sürede herkes kırmızıyı görmezden gelmeye başlar. Ama
      # SUSTURMUYORUZ da: uyarılar burada, her koşuda görünüyor.
      #
      # `cargo audit`in ignore listesine ID eklemek yerine bunu seçtik: ignore
      # uyarıyı susturur, bu ise görünür bırakır. Zincire yeni bir bağımlılık
      # girdiğinde ise `npm run check:onchain-deps` düşer ve birinin bakması
      # gerekir — asıl kapı orası.
      - name: cargo-audit — unsound/unmaintained (bilgi amaçlı)
        working-directory: program/${{ matrix.program }}
        continue-on-error: true
        run: cargo audit --deny warnings

      - name: cargo-deny kurulumu
        run: cargo install cargo-deny --locked

      # SERT KAPI: tedarik zinciri KAYNAĞI.
      #
      # `sources` kontrolü "her paket crates.io'dan mı geliyor" sorusunu
      # soruyor ve bu soru tüm kilit dosyası için ANLAMLI: bir git
      # bağımlılığı, işaret ettiği dal değiştiğinde derlemeye giren kodu
      # sessizce değiştirebilir — test araçlarında bile bunu istemeyiz,
      # çünkü test araçları CI makinemizde çalışıyor.
      - name: cargo-deny — kaynak kontrolü (sert kapı)
        working-directory: program/${{ matrix.program }}
        run: cargo deny --all-features check sources

      # GÖRÜNÜR AMA ENGELLEMEZ: advisories.
      #
      # cargo-deny'nin advisories kontrolü de cargo-audit ile aynı kategori
      # hatasını yapıyor — tüm kilit dosyasına bakıyor ve test yığınındaki
      # (rcgen, x509-parser, quic-client…) bulgularla düşüyor. Açık kararını
      # aşağıdaki adım veriyor: SBF derlemesine GİREN paketlerde açık var mı.
      - name: cargo-deny — advisories (bilgi amaçlı)
        working-directory: program/${{ matrix.program }}
        continue-on-error: true
        run: cargo deny --all-features check advisories

      # SERT KAPI: zincire GİREN paketlerde açık var mı.
      #
      # Bu, cargo-audit'in cevaplayamadığı soruyu cevaplıyor. SBF derlemesine
      # hangi paketlerin girdiği `cargo metadata`daki cfg koşulları
      # değerlendirilerek hesaplanıyor (scripts/lib/sbf-deps.mjs) — standart
      # rustc `sbf-solana-solana` hedefini tanımadığı için `cargo tree
      # --target` kullanılamıyor.
      #
      # Ayrıca zincire giren kümenin kendisi de sabitlenmiş: yeni bir paket
      # girerse denetim düşüyor ve birinin bakması gerekiyor.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: zincire giren paketlerde açık var mı
        env:
          AUDIT_JSON: ${{ github.workspace }}/program/${{ matrix.program }}/audit.json
        run: |
          node scripts/check-onchain-deps.mjs --selftest
          node scripts/check-onchain-deps.mjs

  denetimler:
    name: repo denetimleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Tokenomics / ABI / tx-yolu / hata kodları / kılavuz denetimleri.
      - run: npm run verify
      # Yayına hazırlık: burada DÜŞÜRMÜYOR, yalnızca raporluyor. Mainnet
      # kapısı için `npm run launch-gate` (--strict) kullanılıyor.
      - run: npm run check:launch
