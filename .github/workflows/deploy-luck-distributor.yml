name: luck-distributor — Devnet'e Derle ve Deploy Et

on:
  workflow_dispatch:
    inputs:
      first_deploy:
        description: "false (VARSAYILAN): kaynaktaki declare_id adresindeki programi YUKSELT - adres degismez. true: YENI bir adres uret ve ilk kez deploy et (yalnizca hesap duzeni degistiginde ya da ilk kurulumda; ardindan yazdirilan ID declare_id/Anchor.toml/config.ts'e islenmeli)"
        required: false
        type: boolean
        default: false

# Bu iş akışı, claim/dağıtım programını (program/luck-distributor) derleyip
# Devnet'e kurar. luck-game workflow'uyla aynı deploy cüzdanını
# (LUCK_GAME_DEPLOY_KEY) ve aynı "adrese yükseltme" mantığını kullanıyor.
#
# Rust/Solana/Anchor
# araç zincirini GitHub'ın kendi runner'ında kurup Devnet'e deploy eder.
# Neden CI üzerinden: bu depoyu geliştiren AI ajanının çalıştığı sandbox'ın
# internet erişimi Solana ağına (hatta çoğu dış siteye) kapalı — GitHub
# Actions runner'ları ise tam internet erişimine sahip, bu yüzden build ve
# deploy işini burada yapıyoruz.
#
# Gerekli tek seferlik kurulum: repo Settings → Secrets and variables →
# Actions → "New repository secret" → adı LUCK_GAME_DEPLOY_KEY, değeri ise
# Devnet'e özel, deploy yetkisi için üretilmiş 64 sayılık bir JSON dizisi
# (solana-keygen'in ürettiği formatla aynı). Bu anahtarın SADECE Devnet'te
# değeri var, gerçek parayla hiçbir ilgisi yok.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo önbelleği
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: program/luck-distributor -> target

      - name: Solana CLI kurulumu
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # `anchor build`, PATH'te `solana-install` isimli bir komut bulamayınca
      # (modern Agave kurulumları bunu `agave-install` olarak yeniden
      # adlandırdı) kendi hardcoded eski Solana sürümünü (v1.18.17,
      # rustc 1.75.0 bundle ediyor) indirip kullanıyor — bu da modern
      # paketlerin gerektirdiği edition2024'ü derleyemiyor. Az önce
      # kurduğumuz güncel Solana araç zincirini zorlamak için PATH'e,
      # gerçek `solana-install`/`agave-install`'a (o da yoksa `solana`
      # binary'sine) işaret eden bir uyumluluk sembolik linki ekliyoruz —
      # böylece anchor build kendi eski indirmesini atlayıp bizim
      # kurduğumuz güncel araç zincirini kullanabilir.
      - name: Solana araç zinciri uyumluluk shim'i
        run: |
          BIN_DIR="$HOME/.local/share/solana/install/active_release/bin"
          echo "Kurulu binary'ler:"
          ls -la "$BIN_DIR"
          if [ ! -e "$BIN_DIR/solana-install" ]; then
            if [ -e "$BIN_DIR/agave-install" ]; then
              ln -s "$BIN_DIR/agave-install" "$BIN_DIR/solana-install"
            else
              ln -s "$BIN_DIR/solana" "$BIN_DIR/solana-install"
            fi
            echo "solana-install shim'i oluşturuldu -> $(readlink -f "$BIN_DIR/solana-install")"
          fi
          command -v solana-install && solana-install --version || echo "solana-install hâlâ bulunamadı"

      - name: Anchor CLI kurulumu
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/avm" install 0.30.1
          "$HOME/.cargo/bin/avm" use 0.30.1

      - name: Deploy anahtarını yaz
        run: |
          mkdir -p ~/.config/solana
          cat > ~/.config/solana/id.json <<'KEYFILE'
          ${{ secrets.LUCK_GAME_DEPLOY_KEY }}
          KEYFILE

      - name: Devnet'i yapılandır
        run: solana config set --url devnet --keypair ~/.config/solana/id.json

      - name: Devnet SOL airdrop (deploy ücreti için)
        # GitHub'ın paylaşımlı runner IP'leri devnet faucet'inde sık sık rate
        # limit'e takılıyor — bu yüzden hem daha uzun/çok deneme yapıyoruz
        # hem de burada başarısız olması job'ı durdurmuyor. Airdrop hiç
        # tutmazsa, deploy adımı yetersiz bakiye yüzünden zaten net bir
        # hatayla duracak; o durumda deploy anahtarına (aşağıda yazdırılan
        # public key) manuel olarak devnet SOL göndermek gerekir.
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if solana airdrop 3; then break; fi
            echo "Airdrop denemesi $i başarısız, 20sn sonra tekrar denenecek..."
            sleep 20
          done
          echo "Deploy cüzdanı: $(solana address)"
          solana balance

      # ÖNCEKİ BAŞARISIZ DEPLOY'LARDAN KALAN BUFFER'LARI ÖNCE TEMİZLE.
      #
      # `solana program deploy` yarıda düşerse yazdığı buffer hesabı, içindeki
      # kira SOL'üyle birlikte zincirde kalıyor. Bu, bir sonraki koşuyu da
      # düşürüyor: cüzdan boşalmış oluyor ve `solana program extend` kira
      # ödeyemediği için "custom program error: 0x1" veriyor — hata mesajı
      # sebebi hiç anlatmıyor.
      #
      # Nitekim tam olarak bu oldu: bir önceki koşu 2,3 SOL'ü buffer'da
      # bıraktı, sonraki koşu extend için 0,46 SOL bulamadı. Temizliği
      # yalnızca `if: failure()` adımında yapmak GEÇ kalıyor — parayı bir
      # sonraki koşunun BAŞINDA geri almak gerekiyor.
      - name: Kalan buffer'ları temizle (deploy öncesi)
        run: |
          solana program close --buffers --bypass-warning || \
            echo "Kapatılacak buffer yok."
          echo "Temizlik sonrası bakiye:"
          solana balance

      # ---------------------------------------------------------------
      # Cargo.lock ARTIK REPODAN GELİYOR — burada üretilmiyor.
      # ---------------------------------------------------------------
      # Eskiden bu adım her deploy'da `cargo generate-lockfile` çalıştırıp
      # bağımlılıkları SIFIRDAN çözüyordu. İki ayrı sorun doğuruyordu:
      #
      # 1) Derleme, crates.io'nun o günkü haline bağlıydı. luck-distributor'ın
      #    ilk deploy'u tam olarak böyle düştü: zeroize_derive 1.5.0 çıktı,
      #    edition2024 istiyor, anchor'ın bundle ettiği rustc 1.75 onu
      #    okuyamıyor. Kimse bir şey değiştirmemişti — sadece yukarıda bir
      #    paket yeni sürüm yayınlamıştı. Aynı şey yükseltme sırasında,
      #    TGE günü de olabilirdi.
      #
      # 2) Bytecode yeniden üretilemiyordu. Para tutan bir programda
      #    "zincirdeki bytecode gerçekten bu kaynaktan mı çıktı" sorusunun
      #    cevabı, aynı girdilerle aynı çıktının üretilebilmesine bağlı.
      #    Kilit dosyası olmadan bu mümkün değil.
      #
      # Kilit dosyası artık repoda, v3 formatında (eski araç zinciri v4'ü
      # okuyamıyor) ve MSRV-farkında çözümle üretilmiş durumda:
      #
      #   cargo generate-lockfile \
      #     --config 'resolver.incompatible-rust-versions="fallback"'
      #
      # Bu, rust-version = "1.75.0" bildirimini dikkate alıp her transitive
      # bağımlılığı o derleyicinin derleyebileceği son sürüme düşürüyor.
      # Bağımlılık güncellemesi artık bilinçli bir işlem: yerelde bu komut
      # çalıştırılır, testler koşar, kilit commit'lenir.
      #
      # --locked, kilidin CI'da sessizce değişmesini engelliyor: kilit ile
      # Cargo.toml uyuşmuyorsa derleme, tahmin yürütmek yerine duruyor.
      - name: Cargo.lock doğrula (repodaki kilit kullanılacak)
        working-directory: program/luck-distributor
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "Cargo.lock repoda yok — commit edilmesi gerekiyor." >&2
            exit 1
          fi
          head -n 3 Cargo.lock
          cargo metadata --locked --format-version 1 > /dev/null
          echo "Kilit dosyası Cargo.toml ile tutarlı."

      # ---------------------------------------------------------------
      # Program ID artık KAYNAK KODDAN geliyor, keypair dosyasından değil.
      # ---------------------------------------------------------------
      # Eskiden her deploy'da `anchor keys sync` çalışıyordu: keypair
      # dosyası yoksa yenisini üretip declare_id!()'yi ONA göre yazıyordu.
      # Keypair yalnızca CI önbelleğinde durduğu ve o önbellek Cargo.lock
      # değişince ıskaladığı için, program üst üste ÜÇ KEZ yeni bir adrese
      # deploy oldu — her seferinde config.ts güncellendi, initialize()
      # yeniden koştu, eski kasadaki bakiye orada kaldı.
      #
      # Artık tersi: declare_id!() tek doğru kaynak. Normal deploy'lar o
      # adresteki programı YÜKSELTİYOR ve keypair'e hiç ihtiyaç duymuyor —
      # yükseltme için gereken tek imza upgrade authority'nin (deploy
      # cüzdanı) imzası. Bu yüzden önbellek adımları da tamamen kaldırıldı.
      #
      # `anchor keys sync` yalnızca BİLEREK yeni bir program açarken
      # (first_deploy=true) çalışıyor.
      - name: Yeni program keypair'i üret (yalnızca first_deploy=true ise)
        if: inputs.first_deploy == true
        working-directory: program/luck-distributor
        run: |
          mkdir -p target/deploy
          rm -f target/deploy/luck_distributor-keypair.json
          solana-keygen new --no-bip39-passphrase --silent -o target/deploy/luck_distributor-keypair.json
          anchor keys sync
          echo "Yeni declare_id!():"
          grep declare_id programs/luck-distributor/src/lib.rs

      - name: Hedef Program ID'yi belirle
        working-directory: program/luck-distributor
        run: |
          PROGRAM_ID=$(grep -oP 'declare_id!\("\K[^"]+' programs/luck-distributor/src/lib.rs)
          if [ -z "$PROGRAM_ID" ]; then
            echo "declare_id!() okunamadı" >&2
            exit 1
          fi
          echo "PROGRAM_ID=$PROGRAM_ID" >> "$GITHUB_ENV"
          echo "Hedef Program ID: $PROGRAM_ID"

      # Anchor'ın ayrı "IDL üretim" adımı (host toolchain ile, on-chain SBF
      # derlemesinden bağımsız — istemci SDK'ları için target/idl/*.json
      # üretiyor, deploy'un kendisi için gerekli değil) anchor-syn/
      # proc-macro2 sürüm çakışmalarına saplanıp kaldı: proc-macro2'yi
      # eski sürüme sabitlemek anchor-syn'i düzeltti ama sonra kendi içindeki
      # nightly-uyum kodu, host rustc'nin GERÇEK proc_macro::Span API'siyle
      # çakıştı ("no method named source_file found for &proc_macro::Span").
      # On-chain SBF derlemesi zaten sorunsuz çalışıyor — IDL'i tamamen
      # atlayarak bu ayrı, gereksiz sorun kaynağını devre dışı bırakıyoruz.
      - name: anchor build
        working-directory: program/luck-distributor
        run: anchor build --no-idl

      # `anchor build`, --locked'ı alt araca (cargo-build-sbf) geçirmiyor,
      # dolayısıyla kilidin derleme sırasında sessizce güncellenmesini
      # bayrakla engelleyemiyoruz. Onun yerine SONUCUNU kontrol ediyoruz:
      # kilit dosyası değiştiyse, deploy edilecek bytecode repodaki
      # bağımlılıklardan üretilmemiş demektir ve burada duruyoruz.
      - name: Kilit dosyası değişmedi mi
        working-directory: program/luck-distributor
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock derleme sırasında değişti — deploy durduruluyor." >&2
            git diff -- Cargo.lock | head -n 40
            exit 1
          fi
          echo "Kilit dosyası derleme boyunca değişmedi."

      # İlk deploy: programı keypair'in adresine doğuruyor.
      - name: İlk deploy (yalnızca first_deploy=true ise)
        if: inputs.first_deploy == true
        working-directory: program/luck-distributor
        run: anchor deploy --provider.cluster devnet --provider.wallet ~/.config/solana/id.json

      # Normal yol: ADRESE yükseltme. Keypair GEREKMİYOR — zincir yalnızca
      # upgrade authority'nin imzasını arıyor. Program o adreste yoksa
      # sessizce yeni bir şey yaratmak yerine net bir hatayla duruyoruz.
      - name: Yükselt (varsayılan)
        if: inputs.first_deploy != true
        working-directory: program/luck-distributor
        run: |
          # Bakiyeyi verilen tutarin ustunde tutar; yetersizse airdrop dener.
          # Devnet faucet'i IP basina sinirli oldugu icin tek denemeye
          # guvenmiyoruz.
          bakiyeyi_sagla() {
            local gereken="$1" ad="$2" mevcut
            mevcut=$(solana balance | awk '{print $1}')
            echo "$ad icin gereken ~$gereken SOL - mevcut $mevcut SOL"
            awk "BEGIN{exit !($mevcut < $gereken)}" || return 0
            echo "Bakiye yetersiz - airdrop deneniyor."
            for i in 1 2 3 4 5 6; do
              solana airdrop 2 || true
              mevcut=$(solana balance | awk '{print $1}')
              awk "BEGIN{exit !($mevcut >= $gereken)}" && break
              echo "Deneme $i sonrasi $mevcut SOL, 20sn sonra tekrar."
              sleep 20
            done
            solana balance
          }

          if ! solana program show "$PROGRAM_ID" >/dev/null 2>&1; then
            echo "::error::$PROGRAM_ID adresinde kurulu bir program yok." \
                 "Yeni bir program açmak istiyorsanız bu workflow'u first_deploy=true ile çalıştırın."
            exit 1
          fi
          echo "Mevcut program:"
          solana program show "$PROGRAM_ID"

          # ZİNCİRDEKİ ALANI GEREKİRSE BÜYÜT.
          #
          # Solana, programın verisini sabit boyutlu bir ProgramData
          # hesabında tutuyor ve bu hesap ilk deploy'da ayrılıyor. Program
          # büyüdükçe yükseltme bir noktada
          # "account data too small for instruction" ile düşüyor —
          # nitekim düştü: zincirde 329.728 bayt yer vardı, yeni derleme
          # daha büyüktü. Hata mesajı sebebi hiç anlatmıyor ve bu, koda
          # birkaç satır eklendiği herhangi bir gün gelebilecek bir duvar.
          #
          # Payı bilerek geniş tutuyoruz (64 KiB): her yükseltmede yeniden
          # büyütmek hem ekstra işlem hem ekstra kira demek, ve bu adımın
          # TGE günü sürpriz yapmasını istemiyoruz.
          NEW_LEN=$(stat -c%s target/deploy/luck_distributor.so)
          CUR_LEN=$(solana program show "$PROGRAM_ID" | awk '/Data Length/ {print $3}')
          echo "Yeni derleme: $NEW_LEN bayt · zincirdeki alan: $CUR_LEN bayt"
          if [ -n "$CUR_LEN" ] && [ "$NEW_LEN" -gt "$CUR_LEN" ]; then
            EXTRA=$(( NEW_LEN - CUR_LEN + 65536 ))
            # Genişletme, eklenen baytların kirasını PEŞİN istiyor
            # (~0,00000696 SOL/bayt). Yetersiz bakiyede zincir
            # "custom program error: 0x1" diyor ve sebebi hiç anlatmıyor —
            # bu koşuda saatler kaybettirebilecek bir hata. Onun yerine
            # burada ölçüp gerekirse airdrop istiyoruz.
            bakiyeyi_sagla "$(awk "BEGIN{printf \"%.4f\", $EXTRA * 0.00000696 + 0.05}")" "genisletme"
            echo "Alan yetersiz — $EXTRA bayt genişletiliyor."
            solana program extend "$PROGRAM_ID" "$EXTRA"
            solana program show "$PROGRAM_ID" | grep 'Data Length'
          fi

          # Deploy'un KENDISI de para istiyor ve genisletmeden AYRI bir
          # kalem: `solana program deploy` once programin tamamini gecici bir
          # "buffer" hesabina yaziyor, o hesabin kirasi da program boyutu
          # kadar (~2,3 SOL). Genisletme bakiyeyi tam bu tutarin altina
          # dusurdugu icin deploy "insufficient funds for spend" ile
          # dusmustu - genisletme BASARILI olduktan SONRA, yani en can sikici
          # noktada.
          bakiyeyi_sagla "$(awk "BEGIN{printf \"%.4f\", $NEW_LEN * 0.00000696 + 0.2}")" "deploy"

          solana program deploy \
            --program-id "$PROGRAM_ID" \
            --upgrade-authority ~/.config/solana/id.json \
            target/deploy/luck_distributor.so

      # BAŞARISIZ DEPLOY İKİ ŞEY BIRAKIYOR — ikisi de temizlenmeli.
      #
      # `solana program deploy` önce bir "buffer" hesabına yazıyor, sonra
      # onu programa taşıyor. Ortada düşerse buffer hesabı zincirde,
      # içindeki kira SOL'üyle birlikte kalıyor. Dahası CLI, o buffer'ın
      # geçici anahtarını kurtarmak için 12 KELİMELİK SEED PHRASE'İ LOGA
      # BASIYOR — ve bu repo'nun Actions logları herkese açık. Devnet'te
      # bedeli birkaç test SOL'ü; MAINNET'TE gerçek para.
      #
      # Bu adım, deploy düştüğünde bizim yetkimizdeki tüm buffer'ları
      # kapatıp lamport'ları geri alıyor. Sızan seed phrase de böylece
      # işe yaramaz hale geliyor: kurtaracak bir bakiye kalmıyor.
      - name: Başarısız deploy'dan kalan buffer'ları kapat
        if: failure()
        run: |
          solana program close --buffers --bypass-warning || \
            echo "Kapatılacak buffer bulunamadı (ya da kapatma başarısız oldu)."
          solana balance

      - name: Sonucu doğrula
        working-directory: program/luck-distributor
        run: |
          # first_deploy'da `anchor keys sync` declare_id'yi zaten yeni
          # adrese yazdı ve "Hedef Program ID" adımı onu okudu — yani
          # PROGRAM_ID her iki yolda da doğru.
          echo "================================================"
          echo " PROGRAM ID: $PROGRAM_ID"
          echo "================================================"
          # Zincirdeki hâli yazdırıyoruz: yükseltmenin gerçekten olduğunu
          # (ve authority'nin beklediğimiz cüzdan olduğunu) loglardan
          # doğrulayabilmek için.
          solana program show "$PROGRAM_ID"
          if [ "${{ inputs.first_deploy }}" = "true" ]; then
            echo "::notice::YENİ program açıldı. Bu ID'yi declare_id!(), Anchor.toml ve src/config.ts'e işleyin."
          fi
