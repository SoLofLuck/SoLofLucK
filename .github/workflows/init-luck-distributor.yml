name: luck-distributor — Dağıtım Turu Aç (Devnet)

# TGE günü çalışacak workflow bu: bir dağıtım turu açar ve tokenleri
# kilitler. Programda "parayı geri çek" talimatı YOK — yani bu adım geri
# alınamaz. Bu yüzden varsayılan mod PROVA (dry_run=true): zincire hiç
# dokunmadan hangi sayılarla, hangi takvimle, hangi kökle kilitleneceğini
# yazdırır. Gerçek çalıştırma bilinçli bir seçim olmalı.

on:
  workflow_dispatch:
    inputs:
      program_id:
        description: 'luck-distributor Program ID'
        required: true
        type: string
      mint:
        description: '$LUCK mint adresi'
        required: true
        type: string
      round_id:
        description: 'Tur kimliği — 0 = presale vesting, 1..14 = haftalık çekilişler'
        required: true
        type: string
      merkle_file:
        description: 'Repodaki merkle dosyası (ör. public/merkle/round-0.json)'
        required: true
        type: string
      start_iso:
        description: 'Tur başlangıcı, UTC ISO (ör. 2026-09-01T12:00:00Z)'
        required: true
        type: string
      cliff_bps:
        description: 'TGE anında açılan pay, bps (presale: 900 = %9 · çekiliş: 10000 = %100)'
        required: false
        default: '900'
        type: string
      period_bps:
        description: 'Her kademede açılan pay, bps (presale: 700 = %7 · çekiliş: 0)'
        required: false
        default: '700'
        type: string
      periods:
        description: 'Kademe sayısı (presale: 13 · çekiliş: 0)'
        required: false
        default: '13'
        type: string
      dry_run:
        description: 'PROVA (varsayılan): zincire hiç dokunmadan ne yapacağını yazdırır'
        required: false
        default: true
        type: boolean

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm ci

      # Kilitleme geri alınamaz olduğu için, ABI'nin programla uyuştuğunu
      # zincire dokunmadan ÖNCE bir kez daha doğruluyoruz. Bu kontrol
      # initialize talimatının baytlarını, TGE'de çalışacak script'i
      # koşturarak üretiyor ve programın altın vektörüyle karşılaştırıyor.
      - name: ABI ve tokenomics denetimleri
        run: npm run verify

      - name: Deploy anahtarını yaz
        if: inputs.dry_run != true
        run: |
          mkdir -p ~/.config/solana
          cat > ~/.config/solana/id.json <<'KEYFILE'
          ${{ secrets.LUCK_GAME_DEPLOY_KEY }}
          KEYFILE

      - name: Turu aç
        env:
          PROGRAM_ID: ${{ inputs.program_id }}
          MINT: ${{ inputs.mint }}
          ROUND_ID: ${{ inputs.round_id }}
          MERKLE_FILE: ${{ inputs.merkle_file }}
          START_ISO: ${{ inputs.start_iso }}
          CLIFF_BPS: ${{ inputs.cliff_bps }}
          PERIOD_BPS: ${{ inputs.period_bps }}
          PERIODS: ${{ inputs.periods }}
          KEYPAIR_PATH: /home/runner/.config/solana/id.json
          RPC_URL: https://api.devnet.solana.com
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: node program/luck-distributor/scripts/initialize-round.mjs

      - name: Prova uyarısı
        if: inputs.dry_run == true
        run: |
          echo "::notice::Bu bir PROVAYDI — zincire hiçbir şey yazılmadı." \
               "Gerçek kilitleme için dry_run=false ile tekrar çalıştırın."
