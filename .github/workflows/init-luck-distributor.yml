name: luck-distributor — Open a Distribution Round (Devnet)

# This is the workflow that runs on TGE day: it opens a distribution round and
# locks the tokens. The program has NO "withdraw the money" instruction — so this
# step cannot be undone. That is why the default mode is a REHEARSAL
# (dry_run=true): it prints which numbers, which schedule and which root the
# lock would use, without touching the chain at all. Running it for real has to
# be a deliberate choice.

on:
  workflow_dispatch:
    inputs:
      program_id:
        description: 'luck-distributor Program ID'
        required: true
        type: string
      mint:
        description: '$LUCK mint address'
        required: true
        type: string
      round_id:
        description: 'Round id — 0 = presale vesting, 1..14 = weekly raffles'
        required: true
        type: string
      merkle_file:
        description: 'The merkle file in the repository (e.g. public/merkle/round-0.json)'
        required: true
        type: string
      start_iso:
        description: 'Round start, UTC ISO (e.g. 2026-09-01T12:00:00Z)'
        required: true
        type: string
      cliff_bps:
        description: 'The share unlocked at TGE, in bps (presale: 900 = 9% · raffle: 10000 = 100%)'
        required: false
        default: '900'
        type: string
      period_bps:
        description: 'The share unlocked at each step, in bps (presale: 700 = 7% · raffle: 0)'
        required: false
        default: '700'
        type: string
      periods:
        description: 'Number of steps (presale: 13 · raffle: 0)'
        required: false
        default: '13'
        type: string
      dry_run:
        description: 'REHEARSAL (default): prints what it would do without touching the chain'
        required: false
        default: true
        type: boolean

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Because the lock cannot be undone, we verify once more BEFORE touching
      # the chain that the ABI agrees with the program. This check produces the
      # bytes of the initialize instruction by running the very script that will
      # run at TGE, and compares them against the program's golden vector.
      - name: ABI and tokenomics audits
        run: npm run verify

      - name: Write the deploy key
        if: inputs.dry_run != true
        run: |
          mkdir -p ~/.config/solana
          cat > ~/.config/solana/id.json <<'KEYFILE'
          ${{ secrets.LUCK_GAME_DEPLOY_KEY }}
          KEYFILE

      - name: Open the round
        env:
          PROGRAM_ID: ${{ inputs.program_id }}
          MINT: ${{ inputs.mint }}
          ROUND_ID: ${{ inputs.round_id }}
          MERKLE_FILE: ${{ inputs.merkle_file }}
          START_ISO: ${{ inputs.start_iso }}
          CLIFF_BPS: ${{ inputs.cliff_bps }}
          PERIOD_BPS: ${{ inputs.period_bps }}
          PERIODS: ${{ inputs.periods }}
          KEYPAIR_PATH: /home/runner/.config/solana/id.json
          RPC_URL: https://api.devnet.solana.com
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: node program/luck-distributor/scripts/initialize-round.mjs

      - name: Rehearsal notice
        if: inputs.dry_run == true
        run: |
          echo "::notice::That was a REHEARSAL — nothing was written to the chain." \
               "Run it again with dry_run=false to lock for real."
