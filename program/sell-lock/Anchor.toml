[toolchain]

[features]
resolution = true
skip-lint = false

# Deployed to Devnet through Solana Playground (see program/sell-lock/README.md).
# It has not been deployed to mainnet yet; until it is, the mainnet ID below is a
# placeholder.
[programs.devnet]
sell_lock = "3SgfMbBMbsaB21QaZgcGmRYbUTGGEyErJipxM8u2Uqy5"

[programs.mainnet]
sell_lock = "11111111111111111111111111111111111111112"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
