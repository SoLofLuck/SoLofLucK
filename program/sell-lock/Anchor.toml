[toolchain]

[features]
resolution = true
skip-lint = false

# Solana Playground üzerinden Devnet'e deploy edildi (bkz. program/sell-lock/README.md).
# Mainnet'e henüz deploy edilmedi; oraya deploy edilene kadar aşağıdaki
# mainnet ID'si yer tutucudur.
[programs.devnet]
sell_lock = "3SgfMbBMbsaB21QaZgcGmRYbUTGGEyErJipxM8u2Uqy5"

[programs.mainnet]
sell_lock = "11111111111111111111111111111111111111112"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
