[package]
name = "sell-lock"
version = "0.1.0"
description = "A Token-2022 Transfer Hook: it rejects transfers into a pool's vault (that is, sales) for a given period, and once the period is over it opens up to everyone automatically and permanently."
edition = "2021"
# anchor build falls back to a bundled toolchain with an old rustc (1.75.0,
# same as luck-game/luck-distributor — see their Cargo.toml's own comment)
# when it cannot find `solana-install` on PATH. Declaring rust-version here
# makes `cargo generate-lockfile` resolve every dependency down to a version
# that old compiler can actually build, and keeps the lockfile itself in the
# v3 format that old cargo can parse (v4, cargo's modern default, fails with
# "lock file version 4 requires -Znext-lockfile-bump" — found by actually
# running deploy-sell-lock.yml, since this crate never had that constraint).
rust-version = "1.75.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "sell_lock"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
# NOTE: these version numbers are a combination believed to be compatible, and
# one that could not be verified in this environment. If a version clash or
# incompatibility turns up the first time `anchor build` runs, we may need to
# move to the nearest compatible version with `cargo update -p <pkg>` — that is
# normal, and we fix it together.
anchor-lang = { version = "0.30", features = ["init-if-needed"] }
anchor-spl = { version = "0.30", features = ["token_2022", "token_2022_extensions"] }
spl-tlv-account-resolution = "0.6"
spl-transfer-hook-interface = "0.6"
# The exact same edition2024 chain documented in luck-game's Cargo.toml (this
# crate shares the same anchor-lang/anchor-spl 0.30 dependency tree, so it hits
# the identical problem): solana-program's unconstrained `blake3` dependency
# lets cargo pick the newest blake3, which pulls in constant_time_eq/cpufeatures
# requiring edition2024 — a feature the old rustc 1.75.0 anchor build's bundled
# toolchain uses cannot read. Pinning blake3 to the 1.5.x series (edition2021)
# cuts that chain. Found by actually running deploy-sell-lock.yml.
blake3 = "~1.5"
# arrayref 0.3.10, pulled in by blake3 1.5.0, needs a "proc-macro1" package that
# no longer exists on crates.io. A range excluding 0.3.10 lets cargo pick a
# version that has not been yanked (see luck-game's Cargo.toml for the same pin).
arrayref = ">=0.3.5, <0.3.10"
# anchor-syn 0.30.1 (compiled during Anchor's separate, host-toolchain IDL
# generation step) calls a proc-macro2 API removed in newer releases — pin to
# a version from around when anchor-syn 0.30.1 was published.
proc-macro2 = "=1.0.81"
# Keeps syn (which proc-macro2 above also constrains) old enough that
# borsh-derive's newest version — arriving unconstrained through anchor-lang's
# own borsh dependency — does not require a syn feature only added later.
borsh = "=1.5.1"
borsh-derive = "=1.5.1"
