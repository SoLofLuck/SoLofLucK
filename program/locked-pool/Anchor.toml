[toolchain]

[features]
resolution = true
skip-lint = false

# To be deployed to Devnet through Solana Playground (see
# program/locked-pool/README.md). It has not been deployed to mainnet yet; until
# it is, the mainnet ID below is a placeholder.
[programs.devnet]
locked_pool = "11111111111111111111111111111111111111112"

[programs.mainnet]
locked_pool = "11111111111111111111111111111111111111112"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
