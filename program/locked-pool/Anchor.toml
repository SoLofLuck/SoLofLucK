[toolchain]

[features]
resolution = true
skip-lint = false

# Solana Playground üzerinden Devnet'e deploy edilecek (bkz. program/locked-pool/README.md).
# Mainnet'e henüz deploy edilmedi; oraya deploy edilene kadar aşağıdaki
# mainnet ID'si yer tutucudur.
[programs.devnet]
locked_pool = "11111111111111111111111111111111111111112"

[programs.mainnet]
locked_pool = "11111111111111111111111111111111111111112"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
