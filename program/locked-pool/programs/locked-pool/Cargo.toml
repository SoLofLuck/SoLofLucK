[package]
name = "locked-pool"
version = "0.1.0"
description = "A simple constant-product liquidity pool under our own control: buying is always open, while selling is closed to everyone (the creator included) for a period chosen when the pool is created and never changeable afterwards; once the period is over it opens up to everyone automatically and permanently."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "locked_pool"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
# NOTE: the same version combination verified to work in the sell-lock program.
anchor-lang = { version = "0.30", features = ["init-if-needed"] }
anchor-spl = { version = "0.30" }
