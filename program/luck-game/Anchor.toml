[toolchain]

[features]
resolution = true
skip-lint = false

# Henüz deploy edilmedi (bkz. program/luck-game/README.md). Deploy ettikten
# sonra buradaki ID'yi ve src/lib.rs'teki declare_id!()'yi gerçek program
# ID'siyle güncelleyin.
[programs.devnet]
luck_game = "11111111111111111111111111111111"

[programs.mainnet]
luck_game = "11111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
