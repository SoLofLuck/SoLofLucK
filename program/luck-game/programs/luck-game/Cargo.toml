[package]
name = "luck-game"
version = "0.1.0"
description = "A 777-themed on-chain wheel of fortune: 3 free spins per wallet, 0.1 SOL after that; commit-reveal randomness (based on SlotHashes); the chance of winning goes up once the vault passes a given threshold."
edition = "2021"
# The Solana v1.18.17 tool anchor-cli 0.30.1 downloads during the build bundles
# rustc 1.75.0. Without this field, a modern host cargo can lock transitive
# dependencies (block-buffer, say) to their newest versions, which require the
# edition2024 rustc 1.75.0 does not support. Declaring rust-version makes cargo
# prefer the (older) versions that fit the MSRV when generating the lockfile.
rust-version = "1.75.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "luck_game"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []
# Bypasses the DEPLOY_AUTHORITY check on initialize() — ONLY for the local
# solana-program-test harness under tests/, which signs with a fresh random
# Keypair it cannot make match the real deploy wallet. Never enabled by
# anchor build / cargo build-sbf, so the deployed program is unaffected; run
# tests with `cargo test --features integration-test <filter>`.
integration-test = []

[dependencies]
# NOTE: as in sell-lock/locked-pool, these version numbers could not be built
# and verified in this environment. If a version incompatibility turns up the
# first time `anchor build` runs, it can be fixed with `cargo update -p <pkg>`.
anchor-lang = { version = "0.30", features = ["init-if-needed"] }
# Pinning solana-program (which already arrives transitively through
# anchor-lang) exactly to =1.18.17 was tried, but it brought back
# solana-program's own zeroize/curve25519-dalek version clash in that patch
# (probably fixed separately in a later patch). Instead we pin the real culprit
# directly: solana-program's unconstrained `blake3` dependency was making cargo
# pick the newest blake3 (1.8.6), which in turn wanted the newest
# constant_time_eq/cpufeatures, which require edition2024 — and those cannot be
# built with the old Solana v1.18.17 toolchain anchor-cli uses during the build
# (the one bundling rustc 1.75.0). Pinning blake3 to the 1.5.x series (early
# 2024, edition2021) cuts that chain.
blake3 = "~1.5"
# arrayref 0.3.10, pulled in by blake3 1.5.0, appears to need a very old
# "proc-macro1" package that no longer exists on crates.io ("no matching
# package") — a separate broken record, unrelated to the blake3/edition2024
# problem. Rather than pinning a single version we give a range that excludes
# 0.3.10, so cargo can pick a version that has not been yanked (=0.3.7 was tried
# but turned out to be yanked too).
arrayref = ">=0.3.5, <0.3.10"
# Anchor's IDL generation step (which runs with the host toolchain, separately
# from the SBF build) compiles anchor-syn 0.30.1, which calls
# proc_macro2::Span::call_site().source_file(). That method has been
# removed/changed in the newest proc-macro2 versions — so we pin an older
# proc-macro2 from around when anchor-syn 0.30.1 was published (April 2024).
proc-macro2 = "=1.0.81"
# Pinning proc-macro2 to an older version keeps syn, which depends on it, old
# too — but borsh-derive 1.5.2 (the unconstrained newest version arriving
# through anchor-lang's unconstrained borsh dependency) uses syn's
# TypeParamBound::PreciseCapture variant, which was only added in newer versions
# ("no variant ... PreciseCapture found"). We pin borsh to an older borsh-derive
# version compatible with this proc-macro2/syn pair.
borsh = "=1.5.1"
# The borsh = "=1.5.1" pin only fixes the borsh crate; because borsh-derive is a
# separate package, cargo went on resolving it to the newest 1.5.2 anyway (the
# same PreciseCapture error). So we pin borsh-derive directly as well.
borsh-derive = "=1.5.1"

# The tests run in-process, WITHOUT EVER CONNECTING TO A CHAIN:
# solana-program-test builds the whole runtime (BanksClient) in memory. As in
# luck-distributor, the real gain here is being able to set the chain's state
# (the slot, the SlotHashes sysvar, the vault balance) up EXACTLY AS WE WANT:
# situations that on devnet only come up by chance — a skipped target slot, a
# vault too empty to cover the jackpot, the resolve window closing — can be set
# up directly here and exercised on every run.
[dev-dependencies]
solana-program-test = "~1.18"
solana-sdk = "~1.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
