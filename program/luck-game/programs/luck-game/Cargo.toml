[package]
name = "luck-game"
version = "0.1.0"
description = "777 temalı zincir üstü şans çarkı: cüzdan başına 3 ücretsiz deneme, sonrası 0.1 SOL; commit-reveal (SlotHashes tabanlı) rastgelelik; kasa (vault) belirli bir eşiği geçince kazanma ihtimali artıyor."
edition = "2021"
# anchor-cli 0.30.1'in build sırasında indirdiği Solana v1.18.17 aracı,
# rustc 1.75.0 bundle ediyor. Bu alan olmadan modern host cargo,
# transitive bağımlılıkları (ör. block-buffer) rustc 1.75.0'ın
# desteklemediği edition2024 gerektiren en yeni sürümlere kilitleyebiliyor.
# rust-version bildirmek, cargo'nun lockfile üretirken MSRV'ye uygun
# (daha eski) sürümleri tercih etmesini sağlıyor.
rust-version = "1.75.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "luck_game"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
# NOT: sell-lock/locked-pool'daki gibi, bu sürüm numaraları bu ortamda
# derlenip doğrulanamadı. `anchor build` ilk çalıştığında sürüm
# uyumsuzluğu çıkarsa `cargo update -p <paket>` ile düzeltilebilir.
anchor-lang = { version = "0.30", features = ["init-if-needed"] }
# solana-program'ı (transitive olarak zaten anchor-lang'den geliyor)
# =1.18.17'ye tam sabitlemek denendi ama solana-program'ın o patch'teki
# kendi zeroize/curve25519-dalek sürüm çakışmasını geri getirdi (bu
# muhtemelen sonraki patch'lerde ayrıca düzeltilmiş). Onun yerine asıl
# suçluyu doğrudan sabitliyoruz: solana-program'ın sınırsız `blake3`
# bağımlılığı cargo'nun en yeni blake3'ü (1.8.6) seçmesine yol açıyordu,
# o da edition2024 gerektiren en yeni constant_time_eq/cpufeatures'ı
# istiyordu — bunlar anchor-cli'nin build sırasında kullandığı eski
# (rustc 1.75.0 bundle eden) Solana v1.18.17 araç zinciriyle
# derlenemiyor. blake3'ü 1.5.x serisine (2024 başı, edition2021) sabitlemek
# bu zinciri kesiyor.
blake3 = "~1.5"
# blake3 1.5.0'ın çektiği arrayref 0.3.10, crates.io'da artık bulunmayan
# ("no matching package") çok eski bir "proc-macro1" paketine ihtiyaç
# duyuyor gibi görünüyor — bu blake3/edition2024 sorunuyla ilgisiz, ayrı
# bir bozuk kayıt. Tek bir sürüme sabitlemek yerine 0.3.10'u dışlayan bir
# aralık veriyoruz ki cargo yayından kaldırılmamış (yanked) bir sürüm
# seçebilsin (=0.3.7 denendi ama o da yanked çıktı).
arrayref = ">=0.3.5, <0.3.10"
# Anchor'ın IDL üretim adımı (host toolchain ile, SBF build'inden ayrı
# çalışıyor) anchor-syn 0.30.1'i derliyor; o da
# proc_macro2::Span::call_site().source_file() çağırıyor. Bu metod
# proc-macro2'nin en yeni sürümlerinde kaldırılmış/değişmiş —
# anchor-syn 0.30.1'in yayınlandığı (Nisan 2024) döneme ait eski bir
# proc-macro2 sürümüne sabitliyoruz.
proc-macro2 = "=1.0.81"
# proc-macro2'yi eski sürüme sabitlemek, ona bağlı syn'i de eski tutuyor —
# ama borsh-derive 1.5.2 (anchor-lang'in sınırsız borsh bağımlılığı
# üzerinden gelen, unconstrained en yeni sürüm), syn'in yalnızca yeni
# sürümlerinde eklenen TypeParamBound::PreciseCapture varyantını
# kullanıyor ("no variant ... PreciseCapture found"). borsh'u
# proc-macro2/syn ikilisinin bu sürümüyle uyumlu daha eski bir borsh-derive
# sürümüne sabitliyoruz.
borsh = "=1.5.1"
# borsh = "=1.5.1" pini yalnızca borsh crate'ini sabitliyor; borsh-derive
# ayrı bir paket olduğundan cargo onu yine de en yeni 1.5.2'ye
# çözümlemeye devam ediyordu (aynı PreciseCapture hatası). borsh-derive'ı
# da doğrudan sabitliyoruz.
borsh-derive = "=1.5.1"
