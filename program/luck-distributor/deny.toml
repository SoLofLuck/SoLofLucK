# ---------------------------------------------------------------------------
# cargo-deny — the supply-chain gate
# ---------------------------------------------------------------------------
# This program holds money. EVERY dependency that goes into the bytecode
# uploaded to the chain has to be as trustworthy as our own code — and
# dependencies can change without anybody changing anything.
#
# luck-distributor's first deploy failed exactly like that: zeroize_derive 1.5.0
# was published, it wanted edition2024, and the build broke. That was a
# compatibility problem; a SECURITY hole can arrive through the same channel, and
# then nobody would notice a thing.

# NOTE: the `advisories` check runs in CI FOR INFORMATION, not as a hard gate.
# The reason: cargo-deny (like cargo-audit) looks at the whole Cargo.lock, and
# Cargo.lock contains the Solana validator/TLS stack pulled in for the tests. A
# finding in there does not concern the program uploaded to the chain.
#
# The decision about vulnerabilities is made by `npm run check:onchain-deps`: it
# computes the set of packages that REALLY go into the SBF build and checks the
# advisories against that. That is the hard gate.
#
# `sources`, on the other hand, stays a hard gate — see the explanation below.
[advisories]
version = 2
# A yanked version is one its publisher has said "do not use this" about. If our
# lockfile contains such a version, we need to know.
yanked = "deny"
# No advisory is deliberately ignored. If anything is added here, the REASON has
# to be written down NEXT TO IT — a silent exception added "temporarily" makes
# the whole audit worthless.
ignore = []

[sources]
# Every dependency has to come from crates.io.
#
# That is already the case today (the number of git-sourced packages in the
# lockfiles is 0). The reason we write the rule down is to bind the future: a git
# dependency can silently change the code that goes into the build whenever the
# branch or commit it points at moves. A lockfile holds that in check to a
# degree, but the source itself (one person's repository) lacks crates.io's
# publishing discipline.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
